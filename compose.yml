services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3001:3001"
    environment:
      RUST_LOG: info

  sidecar:
    build:
      context: .
      dockerfile: Dockerfile.sidecar
    hostname: x11web
    depends_on:
      - backend
    ports:
      # WebRTC UDP port range for ICE
      - "10000-10010:10000-10010/udp"
    environment:
      BACKEND_URL: ws://backend:3001/ws/sidecar
      SIDECAR_NAME: local-sidecar
      DISPLAY_NUMBER: "99"
      RUST_LOG: info
      NO_AT_BRIDGE: "1"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_WS_URL: ws://localhost:3001/ws/frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
