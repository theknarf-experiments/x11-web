procs:
  # Local Jaeger all-in-one. Backend + sidecars export traces +
  # metrics to it over OTLP gRPC (`:4317`); UI is at
  # http://localhost:16686. Naming `jaeger` explicitly on the
  # `up` line keeps `mock-oidc` (also in compose.dev.yml) from
  # coming along for the ride — it only joins when the OIDC
  # work needs it.
  jaeger:
    stop:
      send-keys: ["<C-c>"]
    shell: |
      set -e
      docker compose -f compose.dev.yml up jaeger

  backend:
    cmd: ["cargo", "run", "--bin", "x11-web-backend"]
    env:
      RUST_LOG: info
      # Enable OpenTelemetry export to the local Jaeger above.
      # Unset to opt out — the backend logs "OTel disabled" and
      # runs the same as before.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      OTEL_SERVICE_NAME: x11-web-backend

  # X11 sidecar (Linux container) — connects to the host's backend
  # over QUIC :3002 via `host.docker.internal`, reading the QUIC
  # fingerprint from `$HOME/.x11web-fingerprint` (bind-mounted by
  # compose.yml's `sidecar` service).
  sidecar-x11:
    # mprocs writes the keys into the process's pty; Ctrl+C lands as
    # SIGINT on the foreground process group, which is exactly what
    # `docker compose up` interprets as "graceful teardown" — it
    # propagates SIGTERM to the container, waits the grace period,
    # then exits. mprocs's default kill (SIGTERM to bash) doesn't
    # forward to compose, leaving the container orphaned.
    #
    # The `stop: { cmd: ... }` form is master-only; on the released
    # 0.9.2 npm package only signal strings and `send-keys` work.
    stop:
      send-keys: ["<C-c>"]
    shell: |
      set -e
      printf 'Waiting for backend fingerprint at %s/.x11web-fingerprint…\n' "$HOME"
      while [ ! -s "$HOME/.x11web-fingerprint" ]; do sleep 0.2; done
      # Force-remove any container left over from a previous run before
      # `up`. Compose pins the container to the network it was created
      # on by ID; if that network was later deleted (e.g. by a stray
      # `docker network prune` or a worker-network sweep), the next
      # `up` attempts to attach to a dead network ID and fails with
      # "network <id> not found". `rm -fs` drops the stale container so
      # `up` creates a fresh one on the current default network.
      docker compose rm -fs sidecar >/dev/null 2>&1 || true
      docker compose up --build sidecar

  # macOS sidecar — connects to the backend over QUIC :3002. Builds
  # the .app bundle (stable codesign identity for TCC), waits for
  # the backend to write its fingerprint to
  # `$HOME/.x11web-fingerprint`, then launches via `open` so the
  # bundle context (and Screen Recording / Accessibility grants)
  # apply. The fingerprint lives under `$HOME` rather than `target/`
  # because `open` launches the .app from `/` — relative paths
  # don't resolve once we cross that boundary.
  # `open --wait-apps` keeps mprocs blocking so its panel reflects
  # the sidecar lifecycle.
  sidecar-macos:
    # Same pty-keystroke trick as sidecar-x11. mprocs's default stop
    # SIGTERMs only the shell PID, which can't interrupt the
    # `open --wait-apps` foreground child — bash can't run its
    # INT/TERM trap until the current foreground command returns.
    # Ctrl+C through the pty delivers SIGINT to the whole foreground
    # process group, so `open` exits and the trap fires.
    stop:
      send-keys: ["<C-c>"]
    shell: |
      set -e
      crates/sidecar-macos/scripts/build-app.sh
      printf 'Waiting for backend fingerprint at %s/.x11web-fingerprint…\n' "$HOME"
      while [ ! -s "$HOME/.x11web-fingerprint" ]; do sleep 0.2; done
      printf 'Fingerprint ready: %s\n' "$(cat "$HOME/.x11web-fingerprint")"
      LOG=/tmp/x11web-sidecar-macos.log
      : > "$LOG"  # truncate
      printf 'Sidecar log: %s\n' "$LOG"
      # `open --stdout /dev/stdout` makes LaunchServices reject the
      # launch with -10810 — it can't resolve magic /dev paths for
      # the launched app. Redirect to a real file and tail it so
      # mprocs's panel still shows the sidecar's output.
      # Kill the app when this shell exits (mprocs Ctrl+C / restart)
      # so we don't accumulate stale instances. Registered BEFORE
      # the launch so even an early failure cleans up. We do NOT
      # `exec tail` — that would replace the shell process and
      # discard the trap.
      trap 'pkill -f X11WebSidecar.app/Contents/MacOS/x11-web-sidecar-macos 2>/dev/null; rm -f "$LOG"' EXIT INT TERM
      # Start tail in the background so the panel sees output while
      # the app is running. `open --wait-apps` then blocks the
      # foreground until the .app process terminates — either via
      # the tray's Quit menu or via the EXIT trap. When it returns
      # we kill the tail so this shell exits and mprocs reflects
      # the lifecycle.
      tail -f "$LOG" &
      TAIL_PID=$!
      open --wait-apps --stdout "$LOG" --stderr "$LOG" ./target/debug/X11WebSidecar.app
      kill "$TAIL_PID" 2>/dev/null || true
      wait "$TAIL_PID" 2>/dev/null || true

  frontend:
    cmd: ["pnpm", "--filter", "frontend", "dev"]

  storybook:
    cmd: ["pnpm", "--filter", "@x11-web/components", "dev"]
