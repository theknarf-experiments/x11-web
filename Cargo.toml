[workspace]
members = [
    "crates/auth",
    "crates/telemetry",
    "crates/protocol",
    "crates/backend",
    "crates/sidecar",
    "crates/sidecar-macos",
    "crates/wire",
    "crates/rtc-wire",
    "crates/ws-wire",
    "crates/pixel-codec",
    "crates/x11-server",
    "crates/x11rb-protocol-msb",
]
resolver = "2"

# Endian-aware x11rb fork. `tools/setup-x11rb-fork.sh` clones upstream
# into `tools/x11rb-fork/` (outside `target/` so cargo clean doesn't wipe
# it) and applies our patches via `patch -p1`. patch-crate's `git apply`
# can't create new files outside a git repo, which our generator patch
# requires (it adds `src/lib.rs`), so we don't use patch-crate.
[patch."https://github.com/psychon/x11rb.git"]
x11rb-generator = { path = "./tools/x11rb-fork/generator" }
xcbgen = { path = "./tools/x11rb-fork/xcbgen-rs" }

# WebP-lossless encoding via libwebp is CPU-bound. cc-rs picks
# -O0 for libwebp's C source in dev builds by default, which makes
# encode times around 2.5s per ~10 MB frame on retina captures.
# Optimising libwebp-sys (and a few other compute-heavy native
# deps) at -O3 brings that down to ~150 ms while keeping our own
# Rust at -O0 for fast iteration.
[profile.dev.package.libwebp-sys]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
