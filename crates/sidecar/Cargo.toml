[package]
name = "x11-web-sidecar"
version = "0.1.0"
edition = "2021"

[dependencies]
x11-web-protocol = { path = "../protocol" }
x11rb-protocol = { version = "0.13", features = ["request-parsing", "render", "xinput"] }
# pixman removed — using pure-Rust framebuffer to avoid heap corruption
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }
bdf-parser = "0.1"
flate2 = "1"
glob = "0.3"
libc = "0.2"
