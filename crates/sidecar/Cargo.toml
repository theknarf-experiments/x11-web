[package]
name = "x11-web-sidecar"
version = "0.1.0"
edition = "2021"

[features]
default = ["osmesa", "all-extensions"]
osmesa = []
# Extension groups — each gates a set of X11 extensions at compile time.
all-extensions = ["ext-core", "ext-input", "ext-render", "ext-glx", "ext-media", "ext-compat"]
ext-core    = []  # SHAPE, MIT-SHM, BIG-REQUESTS, SYNC, GE, XFIXES, RANDR, XC-MISC, X-Resource
ext-input   = []  # XInputExtension, XTEST, XKEYBOARD
ext-render  = []  # RENDER, Composite, DAMAGE, Present
ext-glx     = []  # GLX, DRI3
ext-media   = []  # XVideo, DOUBLE-BUFFER
ext-compat  = []  # DPMS, MIT-SCREEN-SAVER, VidMode, RECORD, SECURITY, XINERAMA

[dependencies]
x11-web-protocol = { path = "../protocol" }
x11rb-protocol = { version = "0.13", features = [
    "request-parsing",
    "composite", "damage", "dbe", "dpms", "dri3", "glx", "present",
    "randr", "record", "render", "res", "screensaver", "shape", "shm",
    "sync", "xf86vidmode", "xfixes", "xinerama", "xinput", "xkb", "xtest", "xv",
] }
# pixman removed — using pure-Rust framebuffer to avoid heap corruption
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }
bdf-parser = "0.1"
flate2 = "1"
glob = "0.3"
libc = "0.2"
freetype-rs = "0.38"
freetype-sys = { version = "0.23", features = ["bundled"] }
yeslogic-fontconfig-sys = { version = "6", features = ["dlopen"] }
# DBus client — used in PR 2 to mirror GTK / Qt application menus over
# `org.gtk.Menus` and `com.canonical.dbusmenu`. Brought in here so the
# Phase 0 dbus-daemon plumbing can verify it links cleanly.
zbus = { version = "4", default-features = false, features = ["tokio"] }
# WebRTC (Sans-IO) for peer-to-peer data channel + audio streaming
str0m = { version = "0.18", default-features = false, features = ["openssl"] }
# Opus codec for audio encoding/decoding
opus = "0.3"
# SIMD-optimized YUV<->RGB color conversion for XVideo
dcv-color-primitives = "1"
# PulseAudio client for audio capture/playback
libpulse-binding = "2"
libpulse-simple-binding = "2"
