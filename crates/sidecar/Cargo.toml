[package]
name = "x11-web-sidecar"
version = "0.1.0"
edition = "2021"

[dependencies]
# Embeddable X11 server (framebuffer, protocol, extensions). Sidecar
# owns the wire side; the server emits typed events into a channel.
x11-web-x11-server = { path = "../x11-server" }
x11-web-protocol = { path = "../protocol" }
x11-web-wire = { path = "../wire" }
# Pixel encoder shared with sidecar-macos. Sidecar compresses raw
# RGBA pixels into WebP-lossless before they hit the wire.
x11-web-pixel-codec = { path = "../pixel-codec" }
capnp = "0.20"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
