[package]
name = "x11-web-sidecar-macos"
version = "0.1.0"
edition = "2021"

# Only compile real code on macOS. On other platforms this crate is an
# empty shell so `cargo check --workspace` still passes in CI containers
# (the X11 sidecar's Linux Docker builds, the e2e harness, etc.).
[lib]
path = "src/lib.rs"

[[bin]]
name = "x11-web-sidecar-macos"
path = "src/main.rs"

[dependencies]
x11-web-protocol = { path = "../protocol" }
x11-web-wire = { path = "../wire" }
capnp = "0.20"
# Needed at startup to install the default crypto provider that
# `quinn` (via the wire crate) uses for TLS.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
# Pixel encoder shared with the X11 sidecar.
x11-web-pixel-codec = { path = "../pixel-codec" }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"  # used by `windows.rs` for CGWindowList enumeration
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSDictionary", "NSValue", "NSTimer"] }
objc2-screen-capture-kit = { version = "0.3.2", features = [
    "SCShareableContent",
    "SCStream",
    "SCScreenshotManager",
    "block2",
    "dispatch2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-media",
    "libc",
] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGDataProvider", "CGColorSpace", "CGWindow"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes", "CFData", "CFArray", "CFDictionary", "CFNumber"] }
objc2-core-media = { version = "0.3", features = ["CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn"] }
dispatch2 = { version = "0.3", features = ["alloc", "objc2"] }
block2 = "0.6"
objc2-application-services = { version = "0.3.2", features = ["Accessibility"] }
objc2-app-kit = { version = "0.3.2", features = [
    "NSEvent",
    "NSGraphicsContext",
    "NSWorkspace",
    "NSRunningApplication",
    "NSApplication",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSMenu",
    "NSMenuItem",
    "NSButton",
    "NSControl",
    "NSResponder",
] }
