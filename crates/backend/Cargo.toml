[package]
name = "x11-web-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
x11-web-auth = { path = "../auth" }
x11-web-protocol = { path = "../protocol" }
x11-web-wire = { path = "../wire" }
x11-web-rtc-wire = { path = "../rtc-wire" }
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower-sessions = "0.15"
tower-sessions-memory-store = "0.15"
capnp = "0.20"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WebRTC stack (sans-IO). We own the UDP socket; str0m drives ICE,
# DTLS, SCTP, and the DataChannel SCTP layer. No audio/video.
str0m = "0.18"
tracing = "0.1"
# OTel: SDK init lives in `crates/telemetry`; the backend defines
# its own metric instruments and registers them off the shared
# meter. Env-gated — when `OTEL_EXPORTER_OTLP_ENDPOINT` is unset
# the SDK is never initialised.
x11-web-telemetry = { path = "../telemetry" }
opentelemetry = { version = "0.31", features = ["metrics"] }
# Used by the `/api/telemetry/v1/traces` proxy route — the browser
# can't speak gRPC so the frontend OTLP exporter posts protobuf to
# the backend over HTTPS, and we forward it on to OpenObserve with
# the correct auth headers.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
# Per-workspace CRDT documents. We use autosurgeon for the
# ergonomic struct ↔ doc mapping (Reconcile/Hydrate derives) and
# rely on automerge's built-in sync protocol over the control DC.
automerge = "0.7"
autosurgeon = "0.9"
