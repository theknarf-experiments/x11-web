[package]
name = "x11-web-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
x11-web-auth = { path = "../auth" }
x11-web-protocol = { path = "../protocol" }
x11-web-wire = { path = "../wire" }
x11-web-rtc-wire = { path = "../rtc-wire" }
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower-sessions = "0.15"
tower-sessions-memory-store = "0.15"
capnp = "0.20"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WebRTC stack (sans-IO). We own the UDP socket; str0m drives ICE,
# DTLS, SCTP, and the DataChannel SCTP layer. No audio/video.
str0m = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# OTel: env-gated. When `OTEL_EXPORTER_OTLP_ENDPOINT` is unset
# the SDK is never initialised — neither traces nor metrics ride
# anywhere. With it set, we wire the existing `tracing` calls
# into OTel via `tracing-opentelemetry`, and the metrics provider
# exports counters/gauges/histograms over the same OTLP gRPC
# pipe.
opentelemetry = { version = "0.31", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "metrics", "trace"] }
tracing-opentelemetry = "0.32"
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
# Per-workspace CRDT documents. We use autosurgeon for the
# ergonomic struct ↔ doc mapping (Reconcile/Hydrate derives) and
# rely on automerge's built-in sync protocol over the control DC.
automerge = "0.7"
autosurgeon = "0.9"
