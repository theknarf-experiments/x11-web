[package]
name = "x11-web-rtc-wire"
version = "0.1.0"
edition = "2021"

# Binary protocol between the backend and the browser frontend over a
# WebRTC DataChannel. Cap'n Proto framing; raw bytes for pixel data.
# (Originally split from the WS path because that ran JSON-over-text
# at the time. The WS now also speaks Cap'n Proto via
# `crates/ws-wire`; this crate stays separate to keep the
# pixel-stream schema independent from the control-message schema.)

[dependencies]
capnp = "0.20"

[build-dependencies]
# Generates Rust types from schema/wire.capnp into
# OUT_DIR/wire_capnp.rs which lib.rs then `include!`s.
capnpc = "0.20"
