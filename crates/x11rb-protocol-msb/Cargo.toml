[package]
name = "x11rb-protocol-msb"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Pinned to the same rev `tools/setup-x11rb-fork.sh` uses, and redirected
# via the workspace `[patch.crates-io]` table to our patched fork. Future
# endian-aware extensions live in this crate as a thin layer on top.
x11rb-protocol = { version = "0.13", features = [
    "request-parsing",
    "composite", "damage", "dbe", "dpms", "dri3", "glx", "present",
    "randr", "record", "render", "res", "screensaver", "shape", "shm",
    "sync", "xf86vidmode", "xfixes", "xinerama", "xinput", "xkb",
    "xtest", "xv",
] }
