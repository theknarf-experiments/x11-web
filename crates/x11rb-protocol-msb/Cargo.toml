[package]
name = "x11rb-protocol-msb"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# (none yet — this spike just confirms the build-time generation round-trips)

[build-dependencies]
# x11rb's generator is `publish = false` in the upstream workspace, so we
# pull both it and its sibling `xcbgen` from git pinned to a known rev.
# `tools/setup-x11rb-fork.sh` applies our patches to a working copy under
# `tools/x11rb-fork/`, and the workspace-root `[patch."<git-url>"]`
# redirects Cargo here.
x11rb-generator = { git = "https://github.com/psychon/x11rb.git", rev = "4cd9f2429a9e83d8963e569b977df79894f70cab" }
xcbgen = { git = "https://github.com/psychon/x11rb.git", rev = "4cd9f2429a9e83d8963e569b977df79894f70cab" }
